# Netlify configuration for static site deployment
[build]
  base = "."
  # No build command needed for static HTML site
  command = "echo 'No build required - static HTML site'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Security headers for everything
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Content-Security-Policy for the HTML page only (kept off PDFs/media so built-in viewers are not affected).
# The script hash is the inline `document.documentElement.className += ' js';` in index.html —
# recompute it if that line changes:  node -e "..." (see README → Security headers).
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-DamCoPgB/VkDCPsu0R6X4sJsz1c66vGlUGBXLu04Yxg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-DamCoPgB/VkDCPsu0R6X4sJsz1c66vGlUGBXLu04Yxg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Cache static assets (CSS/JS are cache-busted with ?v=, fonts never change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CV PDF must always be served fresh (updated from the private cv repo)
[[headers]]
  for = "/cv.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cv-ats.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CV reel video + poster + social image (re-rendered from source; keep caching short)
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Short paths → project intake form (basvuru.harungecit.dev)
[[redirects]]
  from = "/basvuru"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/hire"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/apply"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

# Design prototypes stay in the repo but are never served
[[redirects]]
  from = "/prototypes/*"
  to = "/404.html"
  status = 404
  force = true

# Repo housekeeping files are not part of the site
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

# No SPA catch-all: unknown paths get a real 404 (Netlify serves /404.html automatically)
