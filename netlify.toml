# Netlify configuration for static site deployment
[build]
  # Base directory
  base = "."
  # No build command needed for static HTML site
  command = "echo 'No build required - static HTML site'"
  # Publish directory is the root directory (where index.html is located)
  publish = "."

# Ignore node_modules and other unnecessary files
[build.environment]
  NODE_VERSION = "18"

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CV PDF must always be served fresh (updated from the private cv repo)
[[headers]]
  for = "/cv.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cv-ats.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Handle SPA routing (if needed in future)
# Short paths → project intake form (basvuru.harungecit.dev) and panel
[[redirects]]
  from = "/basvuru"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/hire"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/apply"
  to = "https://basvuru.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/panel"
  to = "https://panel.harungecit.dev"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
